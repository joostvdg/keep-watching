version: '2'
services:
  db:
    image: postgres:16-alpine
    expose:
      - 5432
    ports:
      - 15432:5432
    environment:
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=docker
      - POSTGRES_DB=kw

  boot1:
    image: joostvdgtanzu/keep-watching:0.1.2
#    build:
#        context: backend
#        dockerfile: docker/boot1/Dockerfile
    platform: linux/arm64
    expose:
        - 8080
    ports:
        - 8080:8080
    links:
        - db
    environment:
        - JDBC_DATABASE_URL=jdbc:postgresql://db:5432/kw
        - JDBC_DATABASE_USERNAME=docker
        - JDBC_DATABASE_PASSWORD=docker
        - PORT=8080
        - JAVA_OPTS="-XX:+UseContainerSupport --XX:ActiveProcessorCount=2 -XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0 -XX:+PrintGCDetails -XX:+PrintGCDateStamps"
    mem_limit: 4096m
    mem_reservation: 2048m
    cpu_shares: 2000
    restart: unless-stopped


